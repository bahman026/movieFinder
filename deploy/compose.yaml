# Production stack for the shared VPS. Lives in ~/moviefinder on the server.
# Always started through deploy.sh, which requires an explicit IMAGE_TAG.
name: moviefinder

services:
  web:
    image: ghcr.io/bahman026/moviefinder-web:${IMAGE_TAG:?set IMAGE_TAG - never start without an explicit tag}
    container_name: moviefinder_web
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # The PHP built-in server handles one request at a time unless told otherwise.
      PHP_CLI_SERVER_WORKERS: "4"
    # No public port: Caddy (togamode_edge_proxy) reaches moviefinder_web:8080 over togamode_edge.
    networks: [edge]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
    name: togamode_edge
