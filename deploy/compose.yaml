# Production stack for the shared VPS. Lives in ~/moviefinder on the server.
# Always started through deploy.sh, which requires an explicit IMAGE_TAG.
name: moviefinder

services:
  web:
    image: ghcr.io/bahman026/moviefinder-web:${IMAGE_TAG:?set IMAGE_TAG - never start without an explicit tag}
    container_name: moviefinder_web
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # The PHP built-in server handles one request at a time per worker, and a
      # viewer watching or downloading holds one worker for the whole transfer.
      # 16 workers ~ a dozen simultaneous viewers plus normal browsing.
      PHP_CLI_SERVER_WORKERS: "16"
      # Watch pages on http so the player streams straight from the movie hosts
      # (no video traffic here). Needs the http://codegeek.ir Caddy block.
      WATCH_OVER_HTTP: "true"
      # The http Watch page must see the same session as the https pages (it
      # holds which links the title offered). Left empty, Laravel marks the
      # cookie Secure on https and the browser would withhold it on http. The
      # session holds only the anonymous Database 2 login and page state.
      SESSION_SECURE_COOKIE: "false"
    # No public port: Caddy (togamode_edge_proxy) reaches moviefinder_web:8080 over togamode_edge.
    networks: [edge]
    mem_limit: 384m   # streaming is chunked (flat memory); this covers 16 idle workers
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
    name: togamode_edge
